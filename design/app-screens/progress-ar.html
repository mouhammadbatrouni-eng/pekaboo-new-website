<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="kit.css" />
<style>
  .hdr { gap: 14px; }
  .hdr .back { width: 24px; height: 24px; color: var(--ink); margin-bottom: 14px; }
  .hdr .avatar { width: 50px; height: 50px; }
  .body { inset-block-end: 0; padding: 22px 16px 0; background: #fff; }
  .panel { padding: 20px 20px 22px; }
  .gauge { display: block; margin: 0 auto; width: 320px; height: 166px; }
  .curr { text-align: center; font-size: 17px; font-weight: 600; color: var(--ink-2); margin: 16px 0 14px; }
  table { width: 100%; border-collapse: collapse; }
  td { height: 33px; border-bottom: 1px solid var(--line); font-size: 15.5px; }
  td:first-child { color: var(--cyan-2); }
  td:last-child { text-align: left; color: #6b7183; direction: ltr; }
  tr:nth-child(6) td:first-child { color: #7dcaf0; }
  tr:nth-child(7) td:first-child { color: #a8dcf5; }
  tr:nth-child(8) td:first-child { color: #c4e8f9; }
  .expand { margin-top: 18px; height: 56px; border-radius: 28px; background: linear-gradient(180deg, #4cc0f0, #2aa9e2); color: #fff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; box-shadow: 0 12px 24px rgba(60, 180, 233, 0.3); }
  .expand .ic { width: 20px; height: 20px; }
</style>
</head>
<body>
<div class="screen" dir="rtl" style="background:#fff">
  <header class="hdr" style="padding-inline:22px">
    <span class="back" data-icon="fwd"></span>
    <img class="avatar" src="img/barret.png" alt="" />
    <div class="ttl"><h1>عمر الأمير</h1><p>تحليل التقدّم</p></div>
  </header>

  <main class="body">
    <section class="card panel" data-band="panel">
      <!-- concentric half-rings; in RTL the fill starts on the right -->
      <svg class="gauge" viewBox="0 0 320 166" data-band="gauge">
        <g id="rings" fill="none" stroke-width="7"></g>
      </svg>
      <p class="curr">المنهج البريطاني 2021</p>
      <table data-band="rows">
        <tr><td>التواصل واللغة</td><td>43.48%</td></tr>
        <tr><td>النمو الشخصي والاجتماعي</td><td>35.29%</td></tr>
        <tr><td>النمو البدني</td><td>4.55%</td></tr>
        <tr><td>القراءة والكتابة</td><td>0.00%</td></tr>
        <tr><td>الرياضيات</td><td>100.00%</td></tr>
        <tr><td>فهم العالم</td><td>40.00%</td></tr>
        <tr><td>الفنون والتصميم</td><td>0.00%</td></tr>
        <tr><td>اللغة العربية</td><td>0.00%</td></tr>
      </table>
      <div class="expand" data-tap="expand"><span data-icon="expand"></span>توسيع</div>
    </section>
  </main>
</div>
<script src="kit.js"></script>
<script>
  // One ring per learning area (outer → inner), filled from the right edge in RTL.
  const pct = [43.48, 35.29, 4.55, 0, 100, 40];
  const tones = ["#3cb4e9", "#5ec2ee", "#7dcdf1", "#93d5f3", "#a9ddf5", "#bfe6f8"];
  const g = document.getElementById("rings");
  pct.forEach((p, i) => {
    const r = 150 - i * 12, cx = 160, cy = 160;
    const bg = `<path d="M${cx - r} ${cy}a${r} ${r} 0 0 1 ${2 * r} 0" stroke="#f1f2f5"/>`;
    const t = (p / 100) * Math.PI;
    const ex = cx + r * Math.cos(t), ey = cy - r * Math.sin(t);
    const fg = p > 0 ? `<path d="M${cx + r} ${cy}A${r} ${r} 0 0 0 ${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="${tones[i]}"/>` : "";
    g.insertAdjacentHTML("beforeend", bg + fg);
  });
</script>
<script>document.querySelectorAll("[data-icon]").forEach((el) => (el.outerHTML = svg(el.dataset.icon, ("ic " + el.className).trim())));</script>
</body>
</html>
