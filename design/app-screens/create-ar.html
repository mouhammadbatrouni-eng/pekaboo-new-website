<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="kit.css" />
<style>
  .body { padding-top: 20px; bottom: 170px; }
  .sec { padding: 18px 18px 18px; margin-bottom: 12px; }
  .sec h2 { font-family: var(--head); font-weight: 800; font-size: 17px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .input { flex: 1; height: 52px; border-radius: 26px; background: #f3f4f7; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; color: #a3a8b6; font-size: 15px; }
  .input .ic { width: 20px; height: 20px; }
  .plus { width: 52px; height: 52px; border-radius: 50%; background: var(--cyan); color: #fff; display: grid; place-items: center; flex: none; }
  .clock { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); color: var(--ink-2); display: grid; place-items: center; flex: none; }
  .opts { display: flex; justify-content: space-between; }
  .opt { width: 78px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 13.5px; color: #8b90a0; }
  .opt .pic { width: 74px; height: 74px; border-radius: 18px; display: grid; place-items: center; border: 1.5px solid transparent; }
  .opt .pic img { width: 64px; height: 64px; object-fit: contain; }
  .opt.on .pic { border-color: var(--cyan); }
  .opt.on { color: var(--cyan-2); font-weight: 700; }
  .plates .opt { width: 96px; }
  .plates .opt .pic { width: 92px; height: 92px; border-radius: 22px; }
  .plates .opt .pic img { width: 80px; height: 80px; }
  .plates { justify-content: space-around; margin-bottom: 12px; }
  .actions { position: absolute; inset: auto 0 93px 0; height: 76px; z-index: 2; display: flex; gap: 10px; padding: 12px 16px 14px; background: linear-gradient(rgba(251, 251, 252, 0), #fbfbfc 30%); }
  .btn { flex: 1; height: 46px; border-radius: 23px; display: grid; place-items: center; font-size: 16px; font-weight: 600; }
  .btn.save { background: linear-gradient(180deg, #4cc0f0, #2aa9e2); color: #fff; box-shadow: 0 8px 18px rgba(60, 180, 233, 0.3); }
  .btn.cancel { background: linear-gradient(180deg, #f0fafe, #d9f1fc); color: var(--cyan-2); }
</style>
</head>
<body>
<div class="screen" dir="rtl">
  <header class="hdr">
    <img class="mark" src="img/bird.png" alt="" />
    <div class="ttl"><h1>التقرير اليومي</h1><p>الاثنين، 21 أبريل 2026</p></div>
    <div class="gear"><span data-icon="gear"></span></div>
  </header>

  <main class="body">
    <section class="card sec" data-band="today">
      <h2>ماذا فعلنا اليوم…</h2>
      <div class="row"><div class="input">أضف تعليقًا…<span data-icon="bubble"></span></div><span class="plus" data-tap="plus"><span data-icon="plus"></span></span></div>
    </section>

    <section class="card sec" data-band="mood">
      <h2>اليوم كنتُ…</h2>
      <div class="opts">
        <div class="opt on" data-tap="happy"><span class="pic"><img src="img/a18.png" alt="" /></span>سعيد</div>
        <div class="opt"><span class="pic"><img src="img/a19.png" alt="" /></span>مستقر</div>
        <div class="opt"><span class="pic"><img src="img/a20.png" alt="" /></span>حزين</div>
        <div class="opt"><span class="pic"><img src="img/a21.png" alt="" /></span>يبكي</div>
      </div>
    </section>

    <section class="card sec" data-band="meal">
      <h2>تناولتُ من فطوري…</h2>
      <div class="opts plates">
        <div class="opt on" data-tap="little"><span class="pic"><img src="img/a22.png" alt="" /></span>القليل</div>
        <div class="opt"><span class="pic"><img src="img/a23.png" alt="" /></span>معظمه</div>
        <div class="opt"><span class="pic"><img src="img/a24.png" alt="" /></span>كله</div>
      </div>
      <div class="row"><div class="input">أضف تعليقًا…<span data-icon="bubble"></span></div><span class="clock"><span data-icon="clock"></span></span></div>
    </section>
  </main>
  <div class="actions" data-band="actions"><span class="btn cancel">إلغاء</span><span class="btn save" data-tap="save">حفظ</span></div>
</div>
<script src="kit.js"></script>
<script>chrome({ active: null });</script>
</body>
</html>
